# Render Blueprint – backend API + PostgreSQL.
# Secrets are NOT stored here: JWT_SECRET is generated by Render, DATABASE_URL comes from the database,
# CORS_ORIGIN is entered in the dashboard (sync: false).
services:
  - type: web
    name: restaurant-occupancy-api
    runtime: node
    plan: free
    rootDir: server
    # devDependencies (typescript, prisma CLI) are needed to build and to run migrations.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Free instances have no pre-deploy step, so migrations run on every start (idempotent).
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render routes traffic to this port (it is also Render's default).
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-occupancy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: restaurant-occupancy-db
    plan: free
    databaseName: restaurant_db
    user: restaurant
